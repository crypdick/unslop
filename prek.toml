minimum_prek_version = "0.5.2"
default_language_version.python = "python3"

# Native prek hygiene hooks. These need no network access or managed environment.
[[repos]]
repo = "builtin"
hooks = [
    {id = "trailing-whitespace"},
    {id = "end-of-file-fixer"},
    {id = "check-json"},
    {id = "check-toml"},
    {id = "check-yaml"},
    {id = "check-merge-conflict"},
    {id = "detect-private-key"},
    {id = "check-added-large-files"},
    {id = "check-case-conflict"},
    {id = "check-symlinks"},
    {id = "destroyed-symlinks"},
    {id = "fix-byte-order-marker"},
    {id = "mixed-line-ending"},
    {id = "check-executables-have-shebangs"},
    {id = "check-shebang-scripts-are-executable"},
]

# Tool versions come from uv.lock; every check uses the project environment.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "uv-lock"
name = "Check dependency lock"
entry = "uv lock --check"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "pyupgrade"
name = "Modernize Python syntax"
entry = "uv run --locked pyupgrade --py313-plus"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "flynt"
name = "Convert string formatting"
entry = "uv run --locked flynt"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ruff-check"
name = "Ruff check"
entry = "uv run --locked ruff check --fix --quiet"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format"
entry = "uv run --locked ruff format --quiet"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "mypy"
name = "Strict type checking"
entry = "uv run --locked mypy"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "vulture"
name = "Find dead code"
entry = "uv run --locked vulture"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "deptry"
name = "Check dependency declarations"
entry = "uv run --locked deptry ."
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "validate-pyproject"
name = "Validate project configuration"
entry = "uv run --locked validate-pyproject pyproject.toml"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "detect-secrets"
name = "Detect secrets"
entry = "uv run --locked detect-secrets-hook --baseline .secrets.baseline"
language = "system"
exclude = "^uv\\.lock$"

[[repos.hooks]]
id = "check-exception-handling"
name = "Check exception handling"
entry = "uv run --locked python scripts/prek_hooks/check_exception_handling.py"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "check-timeless-comments"
name = "Check timeless comments"
entry = "uv run --locked python scripts/prek_hooks/check_timeless_comments.py"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "check-file-length"
name = "Check file length"
entry = "uv run --locked python scripts/prek_hooks/check_file_length.py"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "check-private-test-imports"
name = "Check private test imports"
entry = "uv run --locked python scripts/prek_hooks/check_private_test_imports.py --package detect_slop --package slop_scanner --package slop_patterns --package slop_reports"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "pytest"
name = "Tests and 100% branch coverage"
entry = "uv run --locked pytest"
language = "system"
pass_filenames = false
always_run = true
